services:
  - type: web
    name: p2p-file-transfer
    env: node
    plan: free
    buildCommand: npx pnpm install && npx pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
