<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>File Transfer App</title>

  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 1.5rem;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 380px; width: 100%;">
          <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #7c3aed, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </div>
          <div style="text-align: center;">
            <h1 style="margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.025em; color: #f1f5f9;">
              P2P Secure Transfer
            </h1>
            <p style="margin: 6px 0 0; font-size: 0.75rem; color: #94a3b8; font-weight: 500;">
              Direct Encrypted WebRTC Transport
            </p>
          </div>
          <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 9999px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(51, 65, 85, 0.8);">
            <div style="width: 14px; height: 14px; border: 2px solid rgba(99, 102, 241, 0.25); border-top-color: #818cf8; border-radius: 50%; animation: p2p-spin 0.8s linear infinite;"></div>
            <span style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1;">Loading page...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes p2p-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
